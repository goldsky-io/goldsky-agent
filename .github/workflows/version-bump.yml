name: Auto-bump plugin version

# Skills are consumed by hosts that gate updates on the plugin version:
#   - Claude Code plugin  -> /plugin update compares `version`; unbumped = users keep the cached copy
#   - Cursor plugin       -> requires `version` and gates updates on it (no commit-SHA fallback)
#   - Vercel `skills` CLI  -> `skills update` re-fetches latest from source (version-agnostic)
#   - Goldsky AI chatbot   -> fetches skills live (version-agnostic)
# So any change under skills/ must bump a single version, synced across every host
# manifest, or plugin users go stale. This does it automatically on merge to main.
on:
  push:
    branches: [main]
    paths:
      - "skills/**"

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump patch version and sync all host manifests
        run: |
          set -euo pipefail
          CURRENT=$(jq -r .version package.json)
          NEW=$(echo "$CURRENT" | awk -F. -v OFS=. '{$3 += 1; print}')
          echo "Bumping $CURRENT -> $NEW"
          # sed (not jq) to change ONLY the version value and preserve each file's formatting.
          # Each manifest has a single "version": "x.y.z"; marketplace's is on the plugin entry.
          for f in package.json .claude-plugin/plugin.json .cursor-plugin/plugin.json .claude-plugin/marketplace.json; do
            sed -i -E "s/\"version\": \"[0-9]+\.[0-9]+\.[0-9]+\"/\"version\": \"$NEW\"/" "$f"
          done

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .claude-plugin/plugin.json .cursor-plugin/plugin.json .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "No version change to commit."
            exit 0
          fi
          NEW=$(jq -r .version package.json)
          # [skip ci] + the skills/** path filter + GITHUB_TOKEN's no-retrigger rule all prevent a loop
          git commit -m "chore(release): v$NEW [skip ci]"
          git push origin HEAD:main
