name: CLI installation

on:
  pull_request:
    paths:
      - 'skills/auth-setup/**'
      - 'tests/installer-sandbox.py'
      - '.github/workflows/install-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'skills/auth-setup/**'
      - 'tests/installer-sandbox.py'
      - '.github/workflows/install-smoke.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Installer does not fetch an installer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          banned = (
              'curl',
              'wget',
              'https://goldsky.com',
              'compose.goldsky.com',
              'install-turbo.goldsky.com',
              '@latest',
              '| sh',
              '| bash',
          )
          for name in (
              'skills/auth-setup/scripts/install.sh',
              'skills/auth-setup/scripts/install.ps1',
          ):
              text = Path(name).read_text()
              for needle in banned:
                  if needle in text:
                      raise SystemExit(f'{name} contains {needle!r}')
          print('install scripts do not fetch an installer')
          PY
      - name: Missing npm exits 1
        run: |
          bindir="${RUNNER_TEMP}/bin"
          home="${RUNNER_TEMP}/no-npm-home"
          mkdir -p "$bindir" "$home"
          ln -s "$(command -v uname)" "$bindir/uname"
          ln -s "$(command -v mkdir)" "$bindir/mkdir"
          set +e
          env -i HOME="$home" PATH="$bindir" bash skills/auth-setup/scripts/install.sh >"$RUNNER_TEMP/out.txt" 2>"$RUNNER_TEMP/err.txt"
          status=$?
          set -e
          cat "$RUNNER_TEMP/err.txt"
          test "$status" -eq 1
          grep -q 'npm is required.' "$RUNNER_TEMP/err.txt"
      - name: Installer sandbox
        run: python3 tests/installer-sandbox.py
